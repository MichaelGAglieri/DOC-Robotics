[workspace]
name = "doc-robotics"
version = "0.1.0"
description = "DOC five-axis laboratory: ROS 2 Jazzy and Webots on macOS Apple Silicon"
authors = ["Michael Giuseppe Aglieri"]
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["osx-arm64"]
license = "GPL-3.0-only"

[dependencies]
python = "3.12.*"
ros-jazzy-ros-base = "*"
colcon-common-extensions = "*"
numpy = "*"
requests = "*"
pytest = "*"
pillow = "*"
portaudio = "*"
python-sounddevice = "*"

[pypi-dependencies]
mlx-whisper = "*"

[tasks]
assets = "python scripts/fetch_webots_assets.py"
build = { cmd = "colcon build --symlink-install", cwd = "architetture/laboratorio/ros2_ws" }
test = "python -m pytest -q -p no:launch_testing -p no:launch_ros"
doc = { cmd = "architetture/laboratorio/nodo.sh ros2 launch doc_lab laboratorio.launch.py", depends-on = ["build"] }
doc-voce = { cmd = "architetture/laboratorio/nodo.sh ros2 launch doc_lab laboratorio.launch.py con_voce:=true con_llm:=true", depends-on = ["build"] }
ros = "architetture/laboratorio/nodo.sh ros2"
missioni = "architetture/laboratorio/nodo.sh ros2 run doc_lab mission_monitor"
finestre = "bash architetture/laboratorio/finestre.sh"
webots = "/Applications/Webots.app/Contents/MacOS/webots --mode=pause --stdout --stderr webots_sim/worlds/laboratorio.wbt"
laboratorio-genera = "python scripts/genera_laboratorio.py"
laboratorio-demo = "python scripts/demo_laboratorio.py"
